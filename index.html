<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Mark Attendance - Class 10A</h2>
        <p class="date">Date: <span id="currentDate"></span></p>
        
        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Student Name</th>
                    <th>Attendance</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Alex Johnson</td>
                    <td>
                        <label class="radio-container">Present
                            <input type="radio" name="s1" value="P" checked>
                        </label>
                        <label class="radio-container">Absent
                            <input type="radio" name="s1" value="A">
                        </label>
                    </td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Maria Garcia</td>
                    <td>
                        <label class="radio-container">Present
                            <input type="radio" name="s2" value="P" checked>
                        </label>
                        <label class="radio-container">Absent
                            <input type="radio" name="s2" value="A">
                        </label>
                    </td>
                </tr>
            </tbody>
        </table>
        <button class="btn-submit">Submit Attendance</button>
    </div>
</body>
</html>
